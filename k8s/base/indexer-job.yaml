apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: indexer}
    spec:
      serviceAccountName: indexer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      restartPolicy: OnFailure
      volumes:
        - name: corpus
          persistentVolumeClaim: {claimName: corpus}
        - name: tmp
          emptyDir: {}
        - {name: batch-a, persistentVolumeClaim: {claimName: data-lake-batch-a}}
        - {name: batch-b, persistentVolumeClaim: {claimName: data-lake-batch-b}}
        - {name: quarantine, persistentVolumeClaim: {claimName: quarantine}}
        - {name: archive, persistentVolumeClaim: {claimName: archive}}
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: rahbar-config}
          env:
            - {name: COLLECTION_NAME, value: rahbar}
            - {name: EMBED_MODEL, value: nomic-embed-text}
            - {name: EMBED_VERSION, value: nomic-embed-text-v1}
          volumeMounts:
            - {name: corpus, mountPath: /corpus, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: batch-a, mountPath: /data-lake/batch-a}
            - {name: batch-b, mountPath: /data-lake/batch-b}
            - {name: quarantine, mountPath: /data-lake/quarantine}
            - {name: archive, mountPath: /data-lake/archive}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
